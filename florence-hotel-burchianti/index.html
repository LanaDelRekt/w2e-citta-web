<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dove mangiare - Florence</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --carta:#f6f1e7; --carta-scura:#ece3d4; --inchiostro:#2e2a24; --tenue:#6f6355;
  --bordeaux:#7b2d3b; --terra:#a86a3c; --oro:#b8892b; --verde:#4a7c4e;
  --linea:#d9cdb8; --ombra:rgba(46,42,36,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--carta);color:var(--inchiostro);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;line-height:1.5}
header{padding:28px 20px 18px;border-bottom:2px solid var(--linea);background:var(--carta-scura)}
h1{margin:0 0 4px;font-size:1.7rem;letter-spacing:.01em;color:var(--bordeaux)}
.sub{margin:0;color:var(--tenue);font-size:.92rem}
main{max-width:1240px;margin:0 auto;padding:18px 16px 60px}

/* --- gate --- */
#gate{max-width:420px;margin:12vh auto;padding:28px;background:var(--carta-scura);
  border:1px solid var(--linea);border-radius:10px;box-shadow:0 6px 24px var(--ombra)}
#gate h2{margin:0 0 6px;font-size:1.15rem;color:var(--bordeaux)}
#gate p{margin:0 0 16px;color:var(--tenue);font-size:.9rem}
#gate form{display:flex;gap:8px}
input,select,button{font:inherit;color:inherit}
input[type=password],input[type=search],select{padding:8px 10px;border:1px solid var(--linea);
  border-radius:6px;background:#fffdf8}
input[type=password]{flex:1}
button{padding:8px 16px;border:1px solid var(--bordeaux);border-radius:6px;
  background:var(--bordeaux);color:#fff;cursor:pointer}
button:hover{background:#8f3644}
.errore{color:var(--bordeaux);font-size:.86rem;margin-top:10px;min-height:1.2em}

/* --- filtri --- */
#filtri{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:16px 0;
  padding:14px;background:var(--carta-scura);border:1px solid var(--linea);border-radius:8px}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tenue)}
#conteggio{margin-left:auto;font-size:.86rem;color:var(--tenue)}

/* --- mappa --- */
#mappa{height:420px;border:1px solid var(--linea);border-radius:8px;margin-bottom:20px}
.pin{display:flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;
  box-shadow:0 2px 5px var(--ombra);color:#fff;font:600 11px/1 system-ui,sans-serif}
.pin span{transform:rotate(45deg)}

/* --- tabella --- */
table{width:100%;border-collapse:collapse;font-size:.9rem;background:#fffdf8}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--linea);vertical-align:top}
th{background:var(--carta-scura);cursor:pointer;user-select:none;white-space:nowrap;
  font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--tenue)}
th:hover{color:var(--bordeaux)}
tbody tr:hover{background:#fdf8ee}
.nome{font-weight:600}
.stella{color:#6b3fa0}
.approx{font-style:italic}
.categoria{display:inline-block;margin-top:2px;padding:1px 7px;border-radius:999px;
  font-size:.72rem;color:#6b3fa0;border:1px solid currentColor}
.pin-sugg{border-color:#efe4ff}
.indirizzo{color:var(--tenue);font-size:.82rem}
a{color:var(--bordeaux)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.74rem;
  border:1px solid currentColor;white-space:nowrap}
.b-piedi{color:var(--verde)}
.b-metro{color:var(--terra)}
.b-fuori{color:var(--tenue)}
.t-vicino{color:var(--verde);font-weight:600}
.t-medio{color:var(--oro);font-weight:600}
.t-lontano{color:var(--bordeaux);font-weight:600}
.vuoto{color:var(--tenue)}
.nota{margin-top:26px;padding:14px;border-left:3px solid var(--oro);
  background:var(--carta-scura);font-size:.84rem;color:var(--tenue)}
.nota strong{color:var(--inchiostro)}
.scroll{overflow-x:auto}
#ordina-campo{display:none}

/* --- telefono: la tabella diventa un elenco di schede --------------------
   Otto colonne non stanno in 400 px senza scorrimento orizzontale. Ogni riga
   diventa una scheda e ogni cella si etichetta da sola con data-label. */
@media(max-width:760px){
  body{-webkit-text-size-adjust:100%}
  header{padding:18px 14px 14px}
  h1{font-size:1.3rem}
  main{padding:12px 10px 44px}
  #mappa{height:260px;margin-bottom:14px}

  /* filtri a piena larghezza e bersagli tocca-bili */
  #filtri{gap:10px;padding:12px}
  .campo{flex:1 1 100%}
  .campo input,.campo select{width:100%;min-height:42px;font-size:16px} /* 16px evita lo zoom su iOS */
  #ordina-campo{display:flex}
  #conteggio{margin-left:0;width:100%;text-align:right}

  .scroll{overflow-x:visible}
  table{background:none;font-size:.95rem}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table,tbody,tr,td{display:block;width:auto}
  tbody tr{background:#fffdf8;border:1px solid var(--linea);border-radius:8px;
    padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 3px var(--ombra)}
  tbody tr:hover{background:#fffdf8}
  td{border:0;padding:3px 0;display:flex;gap:12px;align-items:baseline}
  td::before{content:attr(data-label);flex:0 0 8.5em;color:var(--tenue);
    font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
  td>*{flex:1}

  /* numero e nome fanno da intestazione della scheda */
  td[data-label="#"]{display:none}
  td[data-label="Locale"]{display:block;padding:0 0 6px;margin-bottom:6px;
    border-bottom:1px solid var(--linea)}
  td[data-label="Locale"]::before{display:none}
  td[data-label="Locale"] .nome::before{content:attr(data-n) ". ";color:var(--tenue);font-weight:400}
  td[data-label="Come arrivare"]{display:block}
  td[data-label="Come arrivare"]::before{display:block;flex:none;margin-bottom:2px}
}
</style>
</head>

<script>
(function(){
'use strict';
const PAYLOAD = JSON.parse(document.getElementById('payload').textContent);
const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const nf = (n, d) => n.toLocaleString('it-IT', {minimumFractionDigits:d, maximumFractionDigits:d});
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- sblocco ----------
async function decifra(passphrase){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase),
    'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.kdf.iterations, hash:PAYLOAD.kdf.hash},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const chiaro = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.data));
  return JSON.parse(new TextDecoder().decode(chiaro));
}

function apri(dati){
  const gate = document.getElementById('gate');
  if (gate) gate.remove();
  document.getElementById('app').hidden = false;
  avvia(dati);
}

// Payload in chiaro: nessun gate, si mostra tutto subito.
// La presenza di "kdf" e' cio' che distingue una pagina protetta.
if (!PAYLOAD.kdf) {
  document.addEventListener('DOMContentLoaded', () => apri(PAYLOAD));
  if (document.readyState !== 'loading') apri(PAYLOAD);
} else {
  document.getElementById('gate').hidden = false;
  document.getElementById('pw').focus();
  document.getElementById('form-gate').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('errore-gate');
    err.textContent = 'Decifratura in corso...';
    try {
      apri(await decifra(document.getElementById('pw').value));
    } catch (_) {
      // AES-GCM autentica il testo cifrato: se fallisce, la passphrase e' sbagliata.
      err.textContent = 'Passphrase errata.';
    }
  });
}

// ---------- applicazione ----------
let DATI, mappa, strato, sortKey = 'bestMin', sortAsc = true;

function classeTempo(m){ return m <= 15 ? 't-vicino' : m <= 25 ? 't-medio' : 't-lontano'; }
function coloreTempo(m){ return m <= 15 ? '#4a7c4e' : m <= 25 ? '#b8892b' : '#7b2d3b'; }
function ratingMax(r){
  const v = [r.ta, r.gRating].filter(x => typeof x === 'number');
  return v.length ? Math.max.apply(null, v) : null;
}

function avvia(dati){
  DATI = dati;
  const m = dati.meta;
  document.title = m.title;
  document.getElementById('titolo').textContent = m.title;
  document.getElementById('sottotitolo').textContent =
    m.originName + ' - ' + dati.rows.length + ' locali entro ' + m.maxMinutes +
    ' min a piedi o in metro - dati OpenStreetMap del ' + m.generatedAt;
  document.getElementById('nota').innerHTML = m.nota;

  const tempo = document.getElementById('f-tempo');
  tempo.max = Math.max(30, m.maxMinutes);
  tempo.value = m.maxMinutes;
  document.getElementById('f-tempo-val').textContent = m.maxMinutes;

  riempiSelect('f-cucina', dati.rows.map(r => r.cuisine).filter(Boolean));
  riempiSelect('f-costo', dati.rows.map(r => r.cost).filter(Boolean));

  mappa = L.map('mappa');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(mappa);
  strato = L.layerGroup().addTo(mappa);
  L.marker([m.origin.lat, m.origin.lng], {icon: L.divIcon({
    html:'<div style="font-size:26px;line-height:26px">&#127968;</div>',
    className:'', iconSize:[26,26]})})
    .addTo(mappa).bindPopup('<b>' + esc(m.originName) + '</b><br>' + esc(m.origin.label));

  ['f-cerca','f-elenco','f-modo','f-cucina','f-costo','f-rating','f-tempo'].forEach(id =>
    document.getElementById(id).addEventListener('input', render));

  // Da telefono le intestazioni sono nascoste: l'ordinamento passa dal menu.
  const menuOrdina = document.getElementById('f-ordina');
  menuOrdina.addEventListener('change', () => {
    const [k, dir] = menuOrdina.value.split(':');
    sortKey = k; sortAsc = dir === 'asc';
    render();
  });
  document.querySelectorAll('th[data-k]').forEach(th =>
    th.addEventListener('click', () => {
      const k = th.dataset.k;
      if (sortKey === k) sortAsc = !sortAsc; else { sortKey = k; sortAsc = true; }
      menuOrdina.value = `${sortKey}:${sortAsc ? 'asc' : 'desc'}`;
      render();
    }));

  render();
}

function riempiSelect(id, valori){
  const sel = document.getElementById(id);
  Array.from(new Set(valori)).sort((a,b) => a.localeCompare(b,'it')).forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v; sel.appendChild(o);
  });
}

function filtra(){
  const q = document.getElementById('f-cerca').value.trim().toLowerCase();
  const elenco = document.getElementById('f-elenco').value;
  const modo = document.getElementById('f-modo').value;
  const cucina = document.getElementById('f-cucina').value;
  const costo = document.getElementById('f-costo').value;
  const minR = parseFloat(document.getElementById('f-rating').value);
  const maxT = parseInt(document.getElementById('f-tempo').value, 10);
  document.getElementById('f-tempo-val').textContent = maxT;

  return DATI.rows.filter(r => {
    if (q && !(r.name + ' ' + (r.addr || '') + ' ' + (r.categoria || '')).toLowerCase().includes(q)) return false;
    if (elenco === 'suggeriti' && !r.suggested) return false;
    if (elenco === 'trovati' && r.suggested) return false;
    if (modo === 'piedi' && r.needsMetro) return false;
    if (modo === 'metro' && !r.needsMetro) return false;
    if (cucina && r.cuisine !== cucina) return false;
    if (costo && r.cost !== costo) return false;
    // I suggeriti sono scelte deliberate: tempo e voto non li nascondono,
    // altrimenti sparirebbero in silenzio proprio quelli messi apposta.
    if (r.suggested) return true;
    if (r.bestMin > maxT) return false;
    // soglia stretta: "superiore a 4" esclude il 4,0 esatto e i non verificati
    if (minR > 0) { const v = ratingMax(r); if (v === null || v <= minR) return false; }
    return true;
  });
}

function ordina(righe){
  const dir = sortAsc ? 1 : -1;
  return righe.slice().sort((a,b) => {
    let x = a[sortKey], y = b[sortKey];
    if (sortKey === 'g') { x = a.gRating; y = b.gRating; }
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    if (sortKey === 'bestMin'){ if (a.fuoriRete !== b.fuoriRete) return a.fuoriRete ? 1 : -1; }
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * dir;
    return String(x).localeCompare(String(y), 'it') * dir;
  });
}

function celleArrivo(r){
  if (r.fuoriRete){
    // Il modello copre metro e light rail: dove non arrivano, il tempo a piedi
    // sarebbe un numero senza senso, quindi si dichiara il limite.
    return '<span class="badge b-fuori">fuori rete metro</span>' +
      '<div class="indirizzo">la metro non ci arriva: servono Overground, treno o bus, ' +
      'che questa stima non conosce</div>';
  }
  if (!r.needsMetro){
    return '<span class="badge b-piedi">a piedi</span> ' +
      '<span class="' + classeTempo(r.bestMin) + '">' + Math.round(r.bestMin) + ' min</span>';
  }
  const dettaglio = [r.line, r.station ? 'scendi a ' + r.station : null]
    .filter(Boolean).map(esc).join(' - ');
  return '<span class="badge b-metro">metro</span> ' +
    '<span class="' + classeTempo(r.bestMin) + '">' + Math.round(r.bestMin) + ' min</span>' +
    (dettaglio ? '<div class="indirizzo">' + dettaglio + '</div>' : '') +
    '<div class="indirizzo">a piedi sarebbero ' + Math.round(r.walkMin) + ' min</div>';
}

function render(){
  const righe = ordina(filtra());
  const tbody = document.getElementById('righe');
  tbody.innerHTML = '';
  strato.clearLayers();

  righe.forEach(r => {
    const tr = document.createElement('tr');
    // data-label alimenta le etichette delle schede su schermo stretto
    tr.innerHTML =
      '<td data-label="#">' + r.i + '</td>' +
      '<td data-label="Locale"><div class="nome" data-n="' + r.i + '">' +
        (r.suggested ? '<span class="stella" title="suggerito">&#9733;</span> ' : '') +
        esc(r.name) + '</div>' +
        (r.categoria ? '<div class="categoria">' + esc(r.categoria) + '</div>' : '') +
        (r.addr ? '<div class="indirizzo">' + esc(r.addr) + '</div>' : '') +
        (r.nota ? '<div class="indirizzo">' + esc(r.nota) + '</div>' : '') +
        (r.approssimativo ? '<div class="indirizzo approx">posizione approssimativa: ' +
          'il locale non è in OpenStreetMap, il tempo è stimato sulla zona</div>' : '') +
        (r.website ? '<div class="indirizzo"><a href="' + esc(r.website) +
          '" target="_blank" rel="noopener">sito &#8599;</a></div>' : '') +
      '</td>' +
      '<td data-label="Cucina">' + (r.cuisine ? esc(r.cuisine) : '<span class="vuoto">&mdash;</span>') + '</td>' +
      '<td data-label="Costo">' + (r.cost ? esc(r.cost) : '<span class="vuoto">&mdash;</span>') + '</td>' +
      '<td data-label="TripAdvisor">' + (typeof r.ta === 'number'
          ? '<b>' + nf(r.ta,1) + '</b>' + (r.taCount
              ? ' <span class="indirizzo">(' + r.taCount.toLocaleString('it-IT') + ')</span>' : '')
          : '<a href="' + esc(r.taUrl) + '" target="_blank" rel="noopener">cerca &#8599;</a>') + '</td>' +
      '<td data-label="Google">' + (typeof r.gRating === 'number'
          ? '<b>' + nf(r.gRating,1) + '</b>'
          : '<a href="' + esc(r.gUrl) + '" target="_blank" rel="noopener">cerca &#8599;</a>') + '</td>' +
      '<td data-label="Come arrivare">' + celleArrivo(r) + '</td>' +
      '<td data-label="Orari">' + (r.hours ? '<span class="indirizzo">' + esc(r.hours) + '</span>'
                        : '<span class="vuoto">&mdash;</span>') + '</td>';
    tbody.appendChild(tr);

    const colore = r.suggested ? '#6b3fa0' : r.needsMetro ? '#a86a3c' : coloreTempo(r.bestMin);
    L.marker([r.lat, r.lng], {icon: L.divIcon({
      className:'', iconSize:[26,26], iconAnchor:[13,26],
      html:'<div class="pin' + (r.suggested ? ' pin-sugg' : '') + '" style="background:' + colore +
        '"><span>' + r.i + '</span></div>'})})
      .addTo(strato)
      .bindPopup('<b>' + (r.suggested ? '&#9733; ' : '') + esc(r.name) + '</b>' +
        (r.categoria ? '<br>' + esc(r.categoria) : '') +
        '<br>' + esc(r.addr || '') +
        '<br>' + Math.round(r.bestMin) + ' min ' + (r.needsMetro ? 'con la metro' : 'a piedi'));
  });

  document.getElementById('conteggio').textContent =
    righe.length + ' di ' + DATI.rows.length + ' locali';

  const punti = righe.map(r => [r.lat, r.lng])
    .concat([[DATI.meta.origin.lat, DATI.meta.origin.lng]]);
  if (punti.length > 1) mappa.fitBounds(punti, {padding:[30,30]});
  else mappa.setView([DATI.meta.origin.lat, DATI.meta.origin.lng], 14);
}
})();
</script>
